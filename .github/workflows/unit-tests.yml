name: Unit Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install
      # CPU torch wheels: the default CUDA build is a multi-GB download the runner can't use
      run: pip install --extra-index-url https://download.pytorch.org/whl/cpu pytest -e .
    - name: Test
      run: pytest tests/unit.py
